[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-digest"
version = "0.1.0"
authors = [
  { name="Reel Digest Contributors" }
]
description = "Automated pipeline to download Instagram Reels, transcribe audio via faster-whisper, and generate markdown summaries."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "yt-dlp>=2024.08.06",
    "faster-whisper>=1.0.3",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "typer>=0.12.5",
    "pyperclip>=1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/reel-digest"

[project.scripts]
reel = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["reel_digest", "reel_digest.*"]
